name: Feature request
description: Suggest something Cyfan should be able to do
labels: ["enhancement"]
body:
  - type: textarea
    id: task
    attributes:
      label: What are you trying to finish?
      description: >
        Describe the task, not only the control you want added. Cyfan has four
        tabs on purpose, so a new option has to earn its place.
      placeholder: |
        I archive concert recordings and need every part to fit on a DVD-9
        without checking the sizes by hand afterwards.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: With Cyfan, with ffmpeg by hand, or with another program.

  - type: textarea
    id: notes
    attributes:
      label: Anything else
